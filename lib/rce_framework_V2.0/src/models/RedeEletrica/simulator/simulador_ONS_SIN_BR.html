<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard 3D Aprimorado - Fluxo de Potência ONS</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            /* Fundo preto para o espaço */
            color: #f3f4f6;
        }

        #info-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid #374151;
            padding: 16px;
            border-radius: 12px;
            width: 250px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }

        #info-panel h1 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #e5e7eb;
            border-bottom: 1px solid #4b5563;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .region-info {
            margin-bottom: 20px;
        }

        .region-info h2 {
            font-size: 1.1rem;
            color: #38bdf8;
            /* Azul claro para o nome da região */
            margin: 0 0 8px 0;
        }

        .region-info p {
            margin: 4px 0;
            font-size: 0.95rem;
            color: #d1d5db;
        }

        .region-info p strong {
            color: #9ca3af;
        }

        .balance-positive {
            color: #22c55e;
            /* Verde para superávit */
        }

        .balance-negative {
            color: #ef4444;
            /* Vermelho para déficit */
        }

        .label {
            color: #fff;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
            /* Evita que o label interfira nos controles do mouse */
        }

        #map-legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            background-color: rgba(17, 24, 39, 0.8);
            padding: 10px;
        }

        #map-legend img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }

        #map-legend p {
            text-align: center;
            font-size: 0.8rem;
            margin: 5px 0 0 0;
            color: #9ca3af;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <div id="info-panel">
        <h1>Fluxo de Potência (MW) - ONS 2025</h1>
        <div id="data-container">
            <!-- As informações das regiões serão inseridas aqui pelo JavaScript -->
        </div>
    </div>

    <div id="map-legend">
        <!-- Imagem do mapa movida para cá para melhor posicionamento e legenda -->
        <img src="https://images.vexels.com/media/users/3/148333/raw/aac909e2a743f9e1bfa83b997b58a02a-mapa-colorido-do-brasil.jpg"
            alt="Mapa das Regiões do Brasil">
        <p>Mapa de Referência</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>
        // --- SETUP BÁSICO ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 70, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, labelRenderer.domElement);
        controls.enableDamping = true;
        controls.minDistance = 20;
        controls.maxDistance = 150;

        // --- ILUMINAÇÃO ---
        const ambientLight = new THREE.AmbientLight(0xcccccc, 0.8);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(20, 30, 10);
        scene.add(directionalLight);

        // --- CENÁRIO: FUNDO ESTRELADO (NOVO) ---
        const starTexture = new THREE.TextureLoader().load('https://www.solarsystemscope.com/textures/download/2k_stars.jpg');
        const starSphere = new THREE.SphereGeometry(1000, 64, 64);
        const starMaterial = new THREE.MeshBasicMaterial({
            map: starTexture,
            side: THREE.BackSide
        });
        const starField = new THREE.Mesh(starSphere, starMaterial);
        scene.add(starField);

        // --- DADOS INICIAIS ---
        const initialData = {
            norte: { carga: 7871, geracao: { hidraulica: 5736, termica: 1895, eolica: 220 } },
            nordeste: { carga: 12124, geracao: { hidraulica: 2542, termica: 359, eolica: 18247, solar: 7247 } },
            sudeste: { carga: 41949, geracao: { hidraulica: 18610, termica: 7748, ufv_mmgd: 2025 } },
            sul: { carga: 15022, geracao: { hidraulica: 11112, termica: 1105, eolica: 513 } }
        };
        let currentData = JSON.parse(JSON.stringify(initialData));

        // Cores para balanço de energia (NOVO)
        const colorSuperavit = new THREE.Color(0x0ea5e9); // Azul
        const colorDeficit = new THREE.Color(0xf97316); // Laranja

        // --- CRIAÇÃO DO MAPA DO BRASIL (Simplificado) ---
        const mapGroup = new THREE.Group();
        const loader = new THREE.TextureLoader();
        // URL do mapa atualizada
        loader.load('https://images.vexels.com/media/users/3/148333/raw/aac909e2a743f9e1bfa83b997b58a02a-mapa-colorido-do-brasil.jpg',
            (texture) => {
                const planeGeometry = new THREE.PlaneGeometry(55, 55); // Ajuste de proporção para a nova imagem
                const planeMaterial = new THREE.MeshPhongMaterial({
                    map: texture,
                    transparent: true,
                    shininess: 20
                });
                const mapPlane = new THREE.Mesh(planeGeometry, planeMaterial);
                mapPlane.rotation.x = -Math.PI / 2;
                mapGroup.add(mapPlane);
            }, undefined, () => {
                console.error('Falha ao carregar a textura do mapa. Usando um plano cinza.');
                const planeGeometry = new THREE.PlaneGeometry(55, 55);
                const planeMaterial = new THREE.MeshPhongMaterial({ color: 0x444444, shininess: 10 });
                const mapPlane = new THREE.Mesh(planeGeometry, planeMaterial);
                mapPlane.rotation.x = -Math.PI / 2;
                mapGroup.add(mapPlane);
            });
        scene.add(mapGroup);

        // --- POSIÇÕES E NÓS REGIONAIS ---
        // Coordenadas ajustadas para maior precisão geográfica no mapa
        const regionPositions = {
            norte: new THREE.Vector3(-12, 0, -18),    // Mais a oeste e para cima
            nordeste: new THREE.Vector3(15, 0, -8),   // Mais a leste
            sudeste: new THREE.Vector3(10, 0, 8),     // Ligeiramente ajustado
            sul: new THREE.Vector3(2, 0, 18)          // Mais para o sul
        };

        const regionNodes = {};
        const nodeGeometry = new THREE.CylinderGeometry(1.2, 1.2, 1, 32);

        for (const region in regionPositions) {
            const material = new THREE.MeshPhongMaterial({ color: 0xffffff }); // Começa branco
            const node = new THREE.Mesh(nodeGeometry, material);

            node.position.copy(regionPositions[region]);
            mapGroup.add(node);
            regionNodes[region] = node;

            const labelDiv = document.createElement('div');
            labelDiv.className = 'label';
            labelDiv.textContent = region.charAt(0).toUpperCase() + region.slice(1);
            const label = new THREE.CSS2DObject(labelDiv);
            node.add(label); // Adiciona o label ao nó
        }

        // --- CONEXÕES (FLUXO DE ENERGIA) ---
        const connections = [
            { from: 'norte', to: 'nordeste', value: 3602 },
            { from: 'norte', to: 'sudeste', value: 4000 },
            { from: 'nordeste', to: 'sudeste', value: 7710 },
            { from: 'sul', to: 'sudeste', value: 2309 }
        ];

        const particleSystems = [];
        connections.forEach(conn => {
            const startPos = regionPositions[conn.from];
            const endPos = regionPositions[conn.to];
            const curve = new THREE.CatmullRomCurve3([
                startPos,
                new THREE.Vector3((startPos.x + endPos.x) / 2, 15, (startPos.z + endPos.z) / 2),
                endPos
            ]);

            const points = curve.getPoints(50);
            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.4 });
            const curveObject = new THREE.Line(lineGeometry, lineMaterial);
            mapGroup.add(curveObject);

            const particleCount = Math.floor(conn.value / 15);
            const particleGeometry = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);
            const particleProgress = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                const progress = Math.random();
                particleProgress[i] = progress;
                const point = curve.getPointAt(progress);
                particlePositions.set([point.x, point.y, point.z], i * 3);
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            const particleMaterial = new THREE.PointsMaterial({ color: 0xfffde7, size: 0.35, transparent: true, opacity: 0.9 });
            const particles = new THREE.Points(particleGeometry, particleMaterial);
            particleSystems.push({ particles, curve, progress: particleProgress });
            mapGroup.add(particles);
        });

        // --- FUNÇÕES DE ATUALIZAÇÃO ---
        function updateData() {
            for (const region in currentData) {
                currentData[region].carga = Math.round(initialData[region].carga * (1 + (Math.random() - 0.5) * 0.1));
                for (const type in currentData[region].geracao) {
                    currentData[region].geracao[type] = Math.round(initialData[region].geracao[type] * (1 + (Math.random() - 0.5) * 0.1));
                }
            }
        }

        function updateUI() {
            const container = document.getElementById('data-container');
            container.innerHTML = '';
            for (const region in currentData) {
                const data = currentData[region];
                const totalGeracao = Object.values(data.geracao).reduce((sum, value) => sum + value, 0);
                const balanco = totalGeracao - data.carga;
                const balancoClass = balanco >= 0 ? 'balance-positive' : 'balance-negative';
                const balancoSign = balanco >= 0 ? '+' : '';

                const regionDiv = document.createElement('div');
                regionDiv.className = 'region-info';
                regionDiv.innerHTML = `
                    <h2>${region.charAt(0).toUpperCase() + region.slice(1)}</h2>
                    <p><strong>Carga:</strong> ${data.carga.toLocaleString('pt-BR')} MW</p>
                    <p><strong>Geração:</strong> ${totalGeracao.toLocaleString('pt-BR')} MW</p>
                    <p class="${balancoClass}"><strong>Balanço:</strong> ${balancoSign}${balanco.toLocaleString('pt-BR')} MW</p>
                `;
                container.appendChild(regionDiv);
            }
        }

        function updateVisualization() {
            for (const region in regionNodes) {
                const node = regionNodes[region];
                const data = currentData[region];
                const totalGeracao = Object.values(data.geracao).reduce((sum, value) => sum + value, 0);
                const balanco = totalGeracao - data.carga;

                const newCarga = data.carga;
                const newScaleY = Math.max(0.1, newCarga / 4000); // Ajuste no fator de escala

                // Animação suave da altura do pilar
                node.scale.y += (newScaleY - node.scale.y) * 0.1;
                node.position.y = node.scale.y / 2;

                // Muda a cor do nó com base no balanço (superávit/déficit) (MELHORADO)
                const targetColor = balanco >= 0 ? colorSuperavit : colorDeficit;
                node.material.color.lerp(targetColor, 0.1);

                // Atualiza posição do rótulo
                const label = node.children[0];
                if (label) {
                    label.position.set(0, node.scale.y + 1.5, 0);
                }
            }
        }

        // --- LOOP DE ANIMAÇÃO ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Animação das partículas de energia
            const speed = 0.0025;
            particleSystems.forEach(system => {
                const positions = system.particles.geometry.attributes.position.array;
                for (let i = 0; i < system.progress.length; i++) {
                    system.progress[i] += speed;
                    if (system.progress[i] > 1) system.progress[i] = 0;

                    const point = system.curve.getPointAt(system.progress[i]);
                    positions[i * 3] = point.x;
                    positions[i * 3 + 1] = point.y;
                    positions[i * 3 + 2] = point.z;
                }
                system.particles.geometry.attributes.position.needsUpdate = true;
            });

            updateVisualization();

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // --- INICIALIZAÇÃO E INTERVALOS ---
        updateUI();
        updateVisualization(); // Chamada inicial para definir cores e escalas
        animate();

        setInterval(() => {
            updateData();
            updateUI();
        }, 3000);

        // --- RESPONSIVIDADE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
