<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Elétrico com React (CDN)</title>

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Plotly.js for the chart -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

    <!-- React & Babel for component-based UI -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-gradient-to-br from-indigo-300 to-purple-400 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Ícones como Componentes React ---
        const BarrasIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-indigo-500">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
        );

        const LinhasIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-pink-500">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
        );

        const TransformadoresIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-green-500">
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
            </svg>
        );

        const StatusIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-500">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
        );

        // --- Componente do Cartão de Estatísticas ---
        const StatCard = ({ icon, value, label }) => {
            return (
                <div className="bg-white/95 backdrop-blur-sm rounded-2xl p-6 text-center shadow-lg border border-white/30 transition-all duration-300 ease-in-out hover:-translate-y-2 hover:shadow-2xl">
                    <div className="flex justify-center mb-4">
                        {icon}
                    </div>
                    <div className="text-4xl font-bold text-gray-800 mb-2">{value}</div>
                    <div className="text-sm font-semibold text-gray-500 uppercase tracking-wider">{label}</div>
                </div>
            );
        };

        // --- Componente do Gráfico de Rede ---
        const NetworkChart = () => {
            const chartRef = useRef(null);

            useEffect(() => {
                if (chartRef.current && window.Plotly) {
                    const lines_data = [
                        { 'x': [1.967, 2.472, 2.977], 'y': [-0.961, -1.001, -1.041], 'text': 'I=1.508%' },
                        { 'x': [1.967, 2.330, 2.693], 'y': [-0.961, -0.528, -0.095], 'text': 'I=0.721%' },
                        { 'x': [2.977, 3.379, 3.780], 'y': [-1.041, -1.323, -1.606], 'text': 'I=0.709%' },
                        { 'x': [2.977, 3.405, 3.833], 'y': [-1.041, -0.766, -0.491], 'text': 'I=0.543%' },
                        { 'x': [2.977, 2.835, 2.693], 'y': [-1.041, -0.568, -0.095], 'text': 'I=0.403%' },
                        { 'x': [3.780, 3.807, 3.833], 'y': [-1.606, -1.049, -0.491], 'text': 'I=0.24%' },
                        { 'x': [3.833, 3.263, 2.693], 'y': [-0.491, -0.293, -0.095], 'text': 'I=0.627%' },
                        { 'x': [2.532, 2.184, 1.836], 'y': [1.205, 1.147, 1.089], 'text': 'I=0.077%' },
                        { 'x': [2.532, 2.434, 2.337], 'y': [1.205, 1.757, 2.309], 'text': 'I=0.077%' },
                        { 'x': [2.532, 2.920, 3.309], 'y': [1.205, 1.661, 2.117], 'text': 'I=0.181%' },
                        { 'x': [4.274, 3.773, 3.272], 'y': [0.533, 0.747, 0.961], 'text': 'I=0.064%' },
                        { 'x': [4.274, 4.335, 4.396], 'y': [0.533, 1.109, 1.684], 'text': 'I=0.097%' },
                        { 'x': [3.272, 2.554, 1.836], 'y': [0.961, 1.025, 1.089], 'text': 'I=0.04%' },
                        { 'x': [2.337, 2.823, 3.309], 'y': [2.309, 2.213, 2.117], 'text': 'I=0.017%' },
                        { 'x': [3.309, 3.852, 4.396], 'y': [2.117, 1.901, 1.684], 'text': 'I=0.057%' },
                    ];
                    const traces = lines_data.map(line => ({
                        x: line.x, y: line.y, mode: 'lines',
                        line: { color: 'grey', width: 2 },
                        hoverinfo: 'text', text: line.text
                    }));

                    const buses_data = {
                        x: [1.967, 2.977, 3.780, 3.833, 2.693, 2.532, 4.872, 5.904, 4.274, 3.272, 1.836, 2.337, 3.309, 4.396],
                        y: [-0.961, -1.041, -1.606, -0.491, -0.095, 1.205, -0.269, -0.540, 0.533, 0.961, 1.089, 2.309, 2.117, 1.684],
                        text: [
                            'Barra 1<br>V_m = 1.060 pu', 'Barra 2<br>V_m = 1.045 pu', 'Barra 3<br>V_m = 1.010 pu',
                            'Barra 4<br>V_m = 1.018 pu', 'Barra 5<br>V_m = 1.020 pu', 'Barra 6<br>V_m = 1.070 pu',
                            'Barra 7<br>V_m = 1.062 pu', 'Barra 8<br>V_m = 1.090 pu', 'Barra 9<br>V_m = 1.056 pu',
                            'Barra 10<br>V_m = 1.051 pu', 'Barra 11<br>V_m = 1.057 pu', 'Barra 12<br>V_m = 1.055 pu',
                            'Barra 13<br>V_m = 1.050 pu', 'Barra 14<br>V_m = 1.036 pu'
                        ]
                    };
                    traces.push({
                        x: buses_data.x, y: buses_data.y, text: buses_data.text,
                        mode: 'markers', hoverinfo: 'text',
                        marker: { size: 18, color: 'skyblue', symbol: 'circle', line: { width: 2, color: 'darkblue' } }
                    });

                    const layout = {
                        showlegend: false,
                        xaxis: { showgrid: false, zeroline: false, visible: false },
                        yaxis: { showgrid: false, zeroline: false, visible: false },
                        plot_bgcolor: 'rgba(0,0,0,0)', paper_bgcolor: 'rgba(0,0,0,0)',
                        margin: { l: 10, r: 10, t: 10, b: 10 },
                        hovermode: 'closest'
                    };

                    Plotly.newPlot(chartRef.current, traces, layout, { responsive: true });
                }
            }, []);

            return <div ref={chartRef} className="w-full h-[600px] rounded-xl"></div>;
        };

        // --- Página Principal do Dashboard ---
        const DashboardEletricoPage = () => {
            const stats = [
                { icon: <BarrasIcon />, value: '14', label: 'Barras do Sistema' },
                { icon: <LinhasIcon />, value: '15', label: 'Linhas de Transmissão' },
                { icon: <TransformadoresIcon />, value: '5', label: 'Transformadores' },
            ];

            return (
                <div className="container mx-auto p-4 md:p-6">
                    <header className="text-center mb-8 bg-white/95 backdrop-blur-sm rounded-2xl p-8 shadow-2xl border border-white/30">
                        <h1 className="text-4xl md:text-5xl font-bold text-gray-800 mb-2">
                            ⚡ Dashboard do Sistema Elétrico
                        </h1>
                        <p className="text-lg text-gray-500">
                            Monitoramento e Análise da Rede de Potência IEEE 14 Barras
                        </p>
                    </header>

                    <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        {stats.map((stat, index) => (
                            <StatCard key={index} icon={stat.icon} value={stat.value} label={stat.label} />
                        ))}
                        <div className="bg-white/95 backdrop-blur-sm rounded-2xl p-6 text-center shadow-lg border border-white/30 transition-all duration-300 ease-in-out hover:-translate-y-2 hover:shadow-2xl">
                            <div className="flex justify-center mb-4"><StatusIcon /></div>
                            <div className="text-2xl font-bold text-gray-800 mb-2 flex items-center justify-center">
                                <span className="h-3 w-3 bg-green-500 rounded-full mr-2"></span>
                                Normal
                            </div>
                            <div className="text-sm font-semibold text-gray-500 uppercase tracking-wider">Status do Sistema</div>
                        </div>
                    </section>

                    <main className="bg-white/95 backdrop-blur-sm rounded-2xl p-6 md:p-8 shadow-2xl border border-white/30">
                        <h2 className="text-3xl font-bold text-gray-800 text-center mb-6 pb-4 border-b-2 border-gray-200">
                            🔌 Diagrama Unifilar Interativo
                        </h2>
                        <NetworkChart />
                    </main>
                </div>
            );
        };

        // --- Componente Raiz da Aplicação ---
        const App = () => {
            return <DashboardEletricoPage />;
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

    </script>
</body>

</html>
